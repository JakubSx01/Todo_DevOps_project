apiVersion: apps/v1
kind: Deployment

metadata:
  name: todo-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: todo-app

  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
        - name: todo-app
          image: ghcr.io/jakubsx01/todo_devops_project:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8000
          
          envFrom:
            - configMapRef:
                name: todo-app-config
